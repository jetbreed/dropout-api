# render.yaml
services:
  - type: web
    name: dropout-fastapi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dropout-postgres
          property: connectionString

  - type: web
    name: dropout-gateway
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FASTAPI_URL
        fromService:
          name: dropout-fastapi
          type: web
          property: url

databases:
  - name: dropout-postgres
    databaseName: dropout_db
    user: postgres