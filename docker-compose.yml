services:
  postgres:
    image: postgres:15-alpine
    container_name: dropout-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dropout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dropout_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  fastapi-backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    container_name: dropout-fastapi
    ports:
      - "8000:8000"
    environment:
      # - DATABASE_URL=postgresql://postgres:password@postgres:5432/dropout_db
      # - JWT_SECRET=your-super-secret-jwt-key
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/dropout_db
      - JWT_SECRET=your-super-secret-key-change-in-production
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASSWORD=your-app-password
      - FROM_EMAIL=noreply@dropout-api.com
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./fastapi-backend:/app
      - ./models:/app/models
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  express-gateway:
    build:
      context: ./express-gateway
      dockerfile: Dockerfile
    container_name: dropout-gateway
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FASTAPI_URL=http://fastapi-backend:8000
      - JWT_SECRET=your-super-secret-jwt-key
    depends_on:
      - fastapi-backend
      - postgres
    volumes:
      - ./express-gateway:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

  nextjs-dashboard:
    build:
      context: ./nextjs-dashboard
      dockerfile: Dockerfile.dev
    container_name: dropout-nextjs
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://express-gateway:3001
    depends_on:
      - express-gateway
    volumes:
      - ./nextjs-dashboard:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data: