# render.yaml
services:
  - type: web
    name: dropout-fastapi
    runtime: python
    repo: https://github.com/YOUR_USERNAME/dropout-api
    plan: free
    buildCommand: |
      cd fastapi-backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd fastapi-backend
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: dropout-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://dropout-dashboard.vercel.app

databases:
  - name: dropout-db
    databaseName: dropout_db_d7oi
    user: postgres_jet